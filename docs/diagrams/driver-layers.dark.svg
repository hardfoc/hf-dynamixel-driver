<text x="56" y="609" font-size="17" fill="#D2DAE4">ROBOTIS DYNAMIXEL SDK 4.1.0 (Protocol 2.0 packets, CRC) behind a private PortHandler,</text>
<text x="56" y="633.7" font-size="17" fill="#D2DAE4">reaching the line through TransportView, the type-erased view of Transport&lt;Derived&gt;</text>
<text x="56" y="732.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform transport (your class)</text>
<text x="56" y="761.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">open()  close()  set_baud_rate()  write_some()  finish_transmit()  read_some()  discard_stale_input() </text>
<text x="56" y="784.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">now_us()</text>
<text x="56" y="883.4" font-size="20" font-weight="700" fill="#E8EDF3">DYNAMIXEL X-series servos</text>
<text x="56" y="914" font-size="17" fill="#D2DAE4">Half-duplex TTL or RS-485, 8N1, 57600 bit/s factory default, IDs 0 to 252</text>
