<text x="56" y="633.7" font-size="17" fill="#2B3442">reaching the line through TransportView, the type-erased view of Transport&lt;Derived&gt;</text>
<text x="56" y="732.4" font-size="20" font-weight="700" fill="#115E59">Platform transport (your class)</text>
<text x="56" y="761.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">open()  close()  set_baud_rate()  write_some()  finish_transmit()  read_some()  discard_stale_input() </text>
<text x="56" y="784.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">now_us()</text>
<text x="56" y="883.4" font-size="20" font-weight="700" fill="#17202C">DYNAMIXEL X-series servos</text>
